name: Visual or model feedback
description: Report a visible model, texture, lighting or camera issue.
title: "[Visual] "
labels: [enhancement]
body:
  - type: input
    id: version
    attributes:
      label: Game and mod versions
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What needs attention?
      description: Identify the part, viewing angle and lighting, and explain the expected appearance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or reference links
      description: Attach your own captures or link references. Do not upload unlicensed assets or private material.
